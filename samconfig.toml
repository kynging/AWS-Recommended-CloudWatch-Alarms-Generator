# AWS SAM CLI configuration file
# This file contains default parameter values for sam deploy

version = 0.1

[default]
[default.global]
[default.global.parameters]
stack_name = "aws-cloudwatch-alarms-generator"

[default.build]
[default.build.parameters]
cached = true
parallel = true

[default.validate]
[default.validate.parameters]
lint = true

[default.deploy]
[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "aws-cloudwatch-alarms-generator"
region = "us-east-1"
image_repositories = []
disable_rollback = false
parameter_overrides = [
    "AlarmNotificationTopic=\"\"",
    "EventBridgeScheduleCron=\"cron(00 23 * * ? *)\"",
    "ContainerInsightsAlarms=\"Enabled\"",
    "CWAgentAlarms=\"Enabled\"",
    "EC2Alarms=\"Enabled\"",
    "ElastiCacheAlarms=\"Enabled\"",
    "RDSAlarms=\"Enabled\""
]

[default.package]
[default.package.parameters]
resolve_s3 = true

[default.sync]
[default.sync.parameters]
watch = true

[default.local_start_api]
[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda]
[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development environment configuration
[dev]
[dev.deploy]
[dev.deploy.parameters]
stack_name = "aws-cloudwatch-alarms-generator-dev"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "aws-cloudwatch-alarms-generator-dev"
region = "us-east-1"
parameter_overrides = [
    "AlarmNotificationTopic=\"\"",
    "EventBridgeScheduleCron=\"cron(00 23 * * ? *)\"",
    "ContainerInsightsAlarms=\"Enabled\"",
    "CWAgentAlarms=\"Enabled\"",
    "EC2Alarms=\"Enabled\"",
    "ElastiCacheAlarms=\"Enabled\"",
    "RDSAlarms=\"Enabled\""
]

# Staging environment configuration
[staging]
[staging.deploy]
[staging.deploy.parameters]
stack_name = "aws-cloudwatch-alarms-generator-staging"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "aws-cloudwatch-alarms-generator-staging"
region = "us-east-1"
parameter_overrides = [
    "AlarmNotificationTopic=\"arn:aws:sns:us-east-1:ACCOUNT_ID:staging-alarms\"",
    "EventBridgeScheduleCron=\"cron(00 23 * * ? *)\"",
    "ContainerInsightsAlarms=\"Enabled\"",
    "CWAgentAlarms=\"Enabled\"",
    "EC2Alarms=\"Enabled\"",
    "ElastiCacheAlarms=\"Enabled\"",
    "RDSAlarms=\"Enabled\""
]

# Production environment configuration
[prod]
[prod.deploy]
[prod.deploy.parameters]
stack_name = "aws-cloudwatch-alarms-generator-prod"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "aws-cloudwatch-alarms-generator-prod"
region = "us-east-1"
parameter_overrides = [
    "AlarmNotificationTopic=\"arn:aws:sns:us-east-1:ACCOUNT_ID:prod-alarms\"",
    "EventBridgeScheduleCron=\"cron(00 23 * * ? *)\"",
    "ContainerInsightsAlarms=\"Enabled\"",
    "CWAgentAlarms=\"Enabled\"",
    "EC2Alarms=\"Enabled\"",
    "ElastiCacheAlarms=\"Enabled\"",
    "RDSAlarms=\"Enabled\""
]
